<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CC0mon Pocket Catcher</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    body { font-family: 'Press Start 2P', system-ui; }
    .mon-frame { image-rendering: pixelated; }

    @keyframes shake {
      10%, 90% { transform: translate3d(-3px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-5px, 0, 0); }
      40%, 60% { transform: translate3d(5px, 0, 0); }
    }
    .shake { animation: shake 0.6s cubic-bezier(0.36,0,0.66,-0.56) both; }

    @keyframes crystalThrow {
      0%   { transform: translateX(-180px) rotate(-40deg) scale(0.7); }
      65%  { transform: translateX(50px) rotate(200deg) scale(1.05); }
      100% { transform: translateX(210px) rotate(380deg) scale(0.95); }
    }
    .crystal-fly { animation: crystalThrow 0.8s forwards; }
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex flex-col items-center p-4 relative">

  <!-- Top Left: Home -->
  <button onclick="showMain()" 
          class="fixed top-6 left-6 z-50 bg-zinc-900 border border-zinc-700 hover:border-emerald-400 px-4 py-3 rounded-2xl flex items-center gap-2 text-xl shadow-lg transition-all active:scale-95">
    🏠
  </button>

  <!-- Bottom Left: X Link -->
  <a href="https://x.com/badbadweirdo" target="_blank"
     class="fixed bottom-6 left-6 z-50 bg-zinc-900 border border-zinc-700 hover:border-pink-400 px-4 py-3 rounded-2xl flex items-center gap-2 text-xl shadow-lg transition-all active:scale-95">
    🐰 𝕏
  </a>

  <div class="max-w-md w-full pt-16 pb-20">

    <header class="text-center mb-8">
      <h1 class="text-4xl font-bold text-yellow-400 tracking-widest flex items-center justify-center gap-3">
        🐾 CC0MON
      </h1>
      <p class="text-xs text-zinc-400 mt-1">POCKET CATCHER • ONE TRY ONLY</p>
    </header>

    <!-- Main Screen -->
    <div id="main-screen" class="space-y-6">
      <div onclick="startEncounter()" 
           class="bg-gradient-to-b from-emerald-600 to-green-700 border-4 border-emerald-400 rounded-3xl p-10 text-center cursor-pointer hover:scale-105 active:scale-95 transition-all shadow-2xl">
        <div class="text-6xl mb-4">🌿</div>
        <div class="text-2xl font-bold tracking-wider">GO ON A WALK</div>
        <div class="text-emerald-100 text-sm mt-3">Find a wild CC0mon</div>
      </div>
    </div>

    <!-- Encounter Screen (20% more compact) -->
    <div id="encounter-screen" class="hidden bg-zinc-900 border-4 border-amber-400 rounded-3xl p-5 text-center relative overflow-hidden">
      <div class="text-amber-300 text-xs mb-3 tracking-widest">A WILD CC0MON APPEARED!</div>
      
      <div class="relative mb-6 flex justify-center min-h-[210px]">
        <img id="mon-image" src="" alt="CC0mon" class="mon-frame w-52 h-52 border-8 border-white bg-black rounded-3xl shadow-2xl">
        <div id="throw-crystal" class="absolute text-5xl hidden top-1/2 -translate-y-1/2 left-1/2">💎</div>
      </div>

      <div id="mon-name" class="text-2xl font-bold mb-2"></div>
      <div id="mon-energy" class="inline-block px-5 py-1.5 text-xs rounded-2xl font-bold mb-6"></div>

      <button onclick="attemptCatch()" 
              class="w-full bg-red-600 hover:bg-red-700 active:bg-red-800 py-5 rounded-3xl text-xl font-bold shadow-xl transition-all flex items-center justify-center gap-3">
        THROW CRYSTAL
        <span class="text-2xl">💎</span>
      </button>

      <button onclick="runAway()" 
              class="mt-4 text-zinc-400 hover:text-white text-xs py-2">
        Let it run away
      </button>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="hidden bg-zinc-900 border-4 border-white rounded-3xl p-7 text-center">
      <div id="result-title" class="text-3xl font-bold mb-6 min-h-[50px]"></div>
      
      <div id="result-mon" class="mb-8"></div>

      <div class="space-y-3">
        <button onclick="newEncounter()" 
                class="w-full bg-emerald-600 hover:bg-emerald-700 py-4 rounded-3xl font-bold text-lg shadow-lg">
          FIND MORE CC0MONS
        </button>
        
        <a id="opensea-btn" href="#" target="_blank"
           class="hidden w-full bg-blue-600 hover:bg-blue-700 py-4 rounded-3xl font-bold text-lg shadow-lg flex items-center justify-center gap-2">
          VIEW ON OPENSEA
        </a>

        <button onclick="shareToX()" id="share-btn"
                class="hidden w-full bg-black hover:bg-zinc-900 border border-white py-4 rounded-3xl font-bold text-lg flex items-center justify-center gap-2">
          SHARE ON 𝕏
        </button>
      </div>
    </div>

    <!-- Pocket Screen -->
    <div id="pocket-screen" class="hidden">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold">YOUR POCKET <span id="pocket-count" class="text-emerald-400">0</span></h2>
        <button onclick="exportPocketJSON()" 
                class="px-5 py-2 text-xs bg-zinc-800 hover:bg-zinc-700 rounded-2xl">EXPORT JSON</button>
      </div>
      
      <div id="pocket-grid" class="grid grid-cols-4 gap-4 min-h-[380px]"></div>

      <button onclick="clearPocket()" 
              class="mt-8 w-full py-4 text-red-400 hover:text-red-300 border border-red-400/30 rounded-3xl text-sm">
        EMPTY POCKET
      </button>
    </div>
  </div>

  <!-- Bottom Right: Bag -->
  <button onclick="showPocket()" 
          class="fixed bottom-6 right-6 z-50 bg-zinc-900 border border-zinc-700 hover:border-emerald-400 px-5 py-4 rounded-2xl flex items-center gap-2 text-3xl shadow-lg transition-all active:scale-95">
    🎒
  </button>

  <script>
    const API_BASE = "https://api.cc0mon.com";
    let currentMon = null;
    let pocket = JSON.parse(localStorage.getItem("cc0monPocket") || "[]");
    let audioCtx;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playSound(type) {
      initAudio();
      const ctx = audioCtx;
      const now = ctx.currentTime;

      if (type === "throw") {
        const osc = ctx.createOscillator();
        osc.frequency.setValueAtTime(1100, now);
        osc.frequency.exponentialRampToValueAtTime(300, now + 0.55);
        const gain = ctx.createGain();
        gain.gain.value = 0.4;
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
        osc.connect(gain).connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.8);
      } 
      else if (type === "success") {
        const notes = [1300, 1650, 2100, 2600];
        notes.forEach((f, i) => {
          setTimeout(() => {
            const o = ctx.createOscillator();
            o.frequency.value = f;
            const g = ctx.createGain();
            g.gain.value = 0.45;
            g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.7);
            o.connect(g).connect(ctx.destination);
            o.start();
            o.stop(ctx.currentTime + 0.9);
          }, i * 70);
        });
      } 
      else if (type === "fail") {
        const osc = ctx.createOscillator();
        osc.frequency.setValueAtTime(650, now);
        osc.frequency.exponentialRampToValueAtTime(180, now + 1.1);
        const gain = ctx.createGain();
        gain.gain.value = 0.5;
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
        osc.connect(gain).connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 1.3);
      } 
      else if (type === "new") {
        const osc = ctx.createOscillator();
        osc.frequency.value = 1450;
        const gain = ctx.createGain();
        gain.gain.value = 0.25;
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc.connect(gain).connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.55);
      }
    }

    function savePocket() {
      localStorage.setItem("cc0monPocket", JSON.stringify(pocket));
    }

    async function fetchMon(id) {
      try {
        const res = await fetch(`${API_BASE}/cc0mon/${id}`);
        return res.ok ? await res.json() : null;
      } catch (e) { return null; }
    }

    function getCatchRate(rarity) {
      if (!rarity) return 55;
      if (["Mythic", "Legendary"].includes(rarity)) return 18;
      if (rarity === "Rare") return 32;
      if (rarity === "Uncommon") return 48;
      return 65;
    }

    async function startEncounter() {
      document.getElementById("main-screen").classList.add("hidden");
      document.getElementById("encounter-screen").classList.remove("hidden");
      document.getElementById("result-screen").classList.add("hidden");
      document.getElementById("pocket-screen").classList.add("hidden");

      playSound("new");

      const id = Math.floor(Math.random() * 10000) + 1;
      currentMon = await fetchMon(id);

      if (!currentMon) {
        alert("Failed to load mon. Try again.");
        showMain();
        return;
      }

      const imgUrl = `${API_BASE}/cc0mon/${currentMon.tokenId}/image.svg`;
      document.getElementById("mon-image").src = imgUrl;
      document.getElementById("mon-name").textContent = currentMon.name || `CC0mon #${currentMon.tokenId}`;

      const energyAttr = currentMon.attributes?.find(a => a.trait_type === "Energy");
      const energy = energyAttr ? energyAttr.value : "Unknown";
      const energyEl = document.getElementById("mon-energy");
      energyEl.textContent = energy;
      energyEl.className = `inline-block px-5 py-1.5 text-xs rounded-2xl font-bold mb-6 bg-gradient-to-r from-amber-400 to-yellow-400`;
    }

    function attemptCatch() {
      if (!currentMon) return;
      playSound("throw");

      const crystal = document.getElementById("throw-crystal");
      const monImg = document.getElementById("mon-image");

      crystal.classList.remove("hidden");
      crystal.classList.add("crystal-fly");
      monImg.classList.add("shake");

      setTimeout(() => {
        crystal.classList.add("hidden");
        crystal.classList.remove("crystal-fly");
        monImg.classList.remove("shake");

        const rarityAttr = currentMon.attributes?.find(a => a.trait_type === "Rarity");
        const rarity = rarityAttr ? rarityAttr.value : "Common";
        const success = Math.random() * 100 < getCatchRate(rarity);

        document.getElementById("encounter-screen").classList.add("hidden");
        const resultScreen = document.getElementById("result-screen");
        resultScreen.classList.remove("hidden");

        const imgUrl = `${API_BASE}/cc0mon/${currentMon.tokenId}/image.svg`;
        document.getElementById("result-mon").innerHTML = `
          <img src="${imgUrl}" class="mon-frame mx-auto w-52 h-52 border-8 border-white bg-black rounded-3xl ${success ? '' : 'grayscale opacity-70'}">
          <div class="mt-5 text-2xl font-bold">${currentMon.name || `CC0mon #${currentMon.tokenId}`}</div>
        `;

        if (success) {
          playSound("success");
          document.getElementById("result-title").innerHTML = `GOTCHA!`;

          if (!pocket.some(m => m.tokenId === currentMon.tokenId)) {
            pocket.push(currentMon);
            savePocket();
          }

          const contract = "0xeeb036dbbd3039429c430657ed9836568da79d5f";
          const openseaBtn = document.getElementById("opensea-btn");
          openseaBtn.href = `https://opensea.io/assets/ethereum/${contract}/${currentMon.tokenId}`;
          openseaBtn.classList.remove("hidden");

          document.getElementById("share-btn").classList.remove("hidden");
        } else {
          playSound("fail");
          document.getElementById("result-title").innerHTML = `💨 IT RAN AWAY...`;
          document.getElementById("opensea-btn").classList.add("hidden");
          document.getElementById("share-btn").classList.add("hidden");
        }
      }, 850);
    }

    function runAway() {
      document.getElementById("encounter-screen").classList.add("hidden");
      const resultScreen = document.getElementById("result-screen");
      resultScreen.classList.remove("hidden");

      const imgUrl = `${API_BASE}/cc0mon/${currentMon.tokenId}/image.svg`;
      document.getElementById("result-mon").innerHTML = `
        <img src="${imgUrl}" class="mon-frame mx-auto w-52 h-52 border-8 border-white bg-black rounded-3xl grayscale opacity-70">
        <div class="mt-5 text-2xl font-bold">${currentMon.name || `CC0mon #${currentMon.tokenId}`}</div>
      `;
      document.getElementById("result-title").innerHTML = `💨 IT RAN AWAY...`;
      document.getElementById("opensea-btn").classList.add("hidden");
      document.getElementById("share-btn").classList.add("hidden");
      playSound("fail");
    }

    function newEncounter() {
      document.getElementById("result-screen").classList.add("hidden");
      startEncounter();
    }

    function shareToX() {
      if (!currentMon) return;
      const name = currentMon.name || `CC0mon #${currentMon.tokenId}`;
      const text = `Just caught a ${name} in CC0mon Pocket Catcher! One try only and it stayed 🐾`;
      const url = window.location.href;
      const tweetUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`;
      window.open(tweetUrl, "_blank");
    }

    function showMain() {
      document.getElementById("main-screen").classList.remove("hidden");
      document.getElementById("encounter-screen").classList.add("hidden");
      document.getElementById("result-screen").classList.add("hidden");
      document.getElementById("pocket-screen").classList.add("hidden");
    }

    function showPocket() {
      document.getElementById("main-screen").classList.add("hidden");
      document.getElementById("encounter-screen").classList.add("hidden");
      document.getElementById("result-screen").classList.add("hidden");
      document.getElementById("pocket-screen").classList.remove("hidden");

      const grid = document.getElementById("pocket-grid");
      grid.innerHTML = "";
      document.getElementById("pocket-count").textContent = pocket.length;

      if (pocket.length === 0) {
        grid.innerHTML = `<div class="col-span-4 text-center py-16 text-zinc-400 text-sm">Your pocket is empty.<br>Go catch some mons!</div>`;
        return;
      }

      pocket.forEach(mon => {
        const imgUrl = `${API_BASE}/cc0mon/${mon.tokenId}/image.svg`;
        const div = document.createElement("div");
        div.className = "cursor-pointer group";
        div.innerHTML = `
          <img src="${imgUrl}" class="mon-frame w-full aspect-square border-2 border-zinc-600 group-hover:border-emerald-400 rounded-2xl bg-black transition-all">
          <div class="text-[10px] mt-2 text-center truncate">${mon.name || `#${mon.tokenId}`}</div>
        `;
        div.onclick = () => {
          const contract = "0xeeb036dbbd3039429c430657ed9836568da79d5f";
          window.open(`https://opensea.io/assets/ethereum/${contract}/${mon.tokenId}`, "_blank");
        };
        grid.appendChild(div);
      });
    }

    function exportPocketJSON() {
      if (pocket.length === 0) return alert("Your pocket is empty!");
      const dataStr = JSON.stringify(pocket, null, 2);
      const blob = new Blob([dataStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `cc0mon-pocket-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function clearPocket() {
      if (confirm("Clear your entire pocket?")) {
        pocket = [];
        savePocket();
        showPocket();
      }
    }

    // Initialize
    showMain();
  </script>
</body>
</html>
